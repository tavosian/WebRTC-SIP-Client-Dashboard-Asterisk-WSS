<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>WebRTC VoIP Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r148/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sip.js@0.21.2/dist/sip.js"></script>

  <style>
    body { background: #eef1f5; }
    canvas { border-radius: 10px; }
    pre { font-family: monospace; }
  </style>
</head>
<body class="p-10">

<h1 class="text-3xl font-bold mb-6">WebRTC VoIP Dashboard (Asterisk WSS)</h1>

<div class="flex gap-4 mb-6">
  <button id="registerBtn" class="px-5 py-2 bg-blue-600 text-white rounded-lg">Register</button>
  <button id="callBtn" class="px-5 py-2 bg-green-600 text-white rounded-lg">Call</button>
  <button id="hangupBtn" class="px-5 py-2 bg-red-600 text-white rounded-lg">Hangup</button>
  <button id="pauseVisBtn" class="px-5 py-2 bg-yellow-500 text-white rounded-lg">Pause Visuals</button>
</div>

<div class="grid grid-cols-1 xl:grid-cols-2 gap-6">

  <div class="bg-white p-5 rounded-xl shadow">
    <h2 class="text-xl font-semibold mb-3">Waveform</h2>
    <canvas id="wave" width="700" height="150"></canvas>
  </div>

  <div class="bg-white p-5 rounded-xl shadow">
    <h2 class="text-xl font-semibold mb-3">Spectrogram</h2>
    <canvas id="spectrogram" width="700" height="220"></canvas>
  </div>

  <div class="bg-white p-5 rounded-xl shadow">
    <h2 class="text-xl font-semibold mb-3">Realtime RTP Stats</h2>
    <pre id="statsBox" class="bg-black text-green-300 p-4 rounded-xl h-64 overflow-auto text-sm"></pre>
  </div>

  <div class="bg-white p-5 rounded-xl shadow">
    <h2 class="text-xl font-semibold mb-3">3D Packet Flow</h2>
    <div id="threeContainer" style="height:400px;"></div>
  </div>

</div>

<audio id="remoteAudio" autoplay></audio>

<script src="app.js"></script>
</body>
</html>
